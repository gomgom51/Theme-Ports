plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.portdattache.jeu'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.portdattache.jeu'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1'
    }

    // Clé fixe gardée dans le dépôt : une nouvelle version s'installe par-dessus
    // l'ancienne (les sauvegardes sont conservées). Elle ne sert PAS pour le Play Store.
    signingConfigs {
        sideload {
            storeFile file('release.keystore')
            storePassword 'portdattache'
            keyAlias 'portdattache'
            keyPassword 'portdattache'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.sideload
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.sideload
        }
    }

    // Le jeu lui-même est dans ../../web, empaqueté comme ressources de l'application.
    sourceSets {
        main {
            assets.srcDirs = ['../../web']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
