name: APK Android

# Version Android mise de côté (jeu sur ordinateur seulement, choix du propriétaire, 2026-11-27) :
# l'APK ne se construit plus à chaque envoi (une release GitHub par envoi, près de 180 en quatre jours).
# Pour en construire un : onglet Actions → APK Android → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Construire l'APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk PortDAttache.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PortDAttache-apk
          path: PortDAttache.apk

      # Une « release » GitHub permet de télécharger l'APK directement depuis le téléphone :
      # https://github.com/<propriétaire>/<dépôt>/releases/latest/download/PortDAttache.apk
      - name: Publier une release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${{ github.run_number }}"
          gh release create "$TAG" PortDAttache.apk \
            --target "${{ github.sha }}" \
            --title "Port d'Attache – version ${{ github.run_number }}" \
            --notes "APK Android à installer sur le téléphone (voir le README)." \
            --latest
