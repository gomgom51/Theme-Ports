name: APK Android

on:
  push:
    paths:
      - 'web/**'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Construire l'APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk PortDAttache.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PortDAttache-apk
          path: PortDAttache.apk

      # Une « release » GitHub permet de télécharger l'APK directement depuis le téléphone :
      # https://github.com/<propriétaire>/<dépôt>/releases/latest/download/PortDAttache.apk
      - name: Publier une release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${{ github.run_number }}"
          gh release create "$TAG" PortDAttache.apk \
            --target "${{ github.sha }}" \
            --title "Port d'Attache – version ${{ github.run_number }}" \
            --notes "APK Android à installer sur le téléphone (voir le README)." \
            --latest
