name: Tests

on:
  push:
    paths:
      - 'web/js/**'
      - 'tests/**'
      - 'tools/i18n-*'
      - 'tools/code-check.mjs'
      - '.github/workflows/tests.yml'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cohérence du code (stockage, formats, code mort ; docs/code-health.md)
        run: node tools/code-check.mjs
      - name: Routes maritimes
        run: node tests/routing.test.mjs
      - name: Simulation (4 compagnies IA, 3 ans)
        run: node tests/sim.test.mjs 3 12345
      - name: Anciennes sauvegardes (elles se chargent et la partie continue)
        run: node tests/saves.test.mjs
      - name: Version anglaise (aucun texte resté en français)
        run: node tools/i18n-check.mjs
      - name: Icônes (chaque émoji a son dessin)
        run: node tools/icons-check.mjs
