name: Tests

on:
  push:
    paths:
      - 'web/js/**'
      - 'tests/**'
      - 'tools/i18n-*'
      - '.github/workflows/tests.yml'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Routes maritimes
        run: node tests/routing.test.mjs
      - name: Simulation (4 compagnies IA, 3 ans)
        run: node tests/sim.test.mjs 3 12345
      - name: Version anglaise (aucun texte resté en français)
        run: node tools/i18n-check.mjs
      # Le même contrôle sur les vrais écrans : partie jouée en anglais dans Chrome (déjà sur la machine).
      - name: Version anglaise à l'écran (navigateur caché)
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.63.0
          node tools/i18n-screens.mjs
