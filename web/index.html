<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1622">
  <meta name="description" content="Port d'Attache : jeu de gestion de compagnie maritime.">
  <title>Port d'Attache</title>
  <link rel="icon" href="icons/icon-16.png" sizes="16x16" type="image/png">
  <link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/stardos-stencil-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/pda-icons.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="map" class="map unzoom"></div>

  <header id="hud" class="hud">
    <button id="hud-company" class="hud-company" type="button" title="Compagnie aux commandes">
      <span id="hud-company-logo" class="badge-wrap"></span>
      <span class="hud-company-text">
        <span id="hud-company-name" class="hud-company-name"></span>
        <span id="hud-cash" class="hud-cash"></span>
        <span id="hud-debt" class="hud-debt" hidden></span>
      </span>
      <span id="hud-rep" class="hud-rep" role="button" tabindex="0" data-guide="rep">
        <span class="hud-rep-top">
          <span class="hud-rep-main"><span aria-hidden="true">★</span> <b id="hud-rep-val"></b></span>
          <span class="hud-rep-sub"><span id="hud-trust" class="hud-trust"></span> <span id="hud-virtue" class="hud-virtue"></span></span>
        </span>
        <span id="hud-quote" class="hud-quote"></span>
      </span>
      <span class="hud-switch" aria-hidden="true">⇄</span>
    </button>
    <div id="hud-context" class="hud-context" aria-live="polite"></div>
    <div class="hud-time">
      <span id="hud-date" class="hud-date"></span>
      <div class="speed" role="group" aria-label="Vitesse du temps">
        <button type="button" data-speed="0" title="Pause (Espace)" aria-label="Pause">❚❚</button>
        <button type="button" data-speed="1" title="Vitesse 1 · double-clic : par défaut" aria-label="Vitesse 1">▶</button>
        <button type="button" data-speed="2" title="Vitesse 2 · double-clic : par défaut" aria-label="Vitesse 2">▶▶</button>
        <button type="button" data-speed="3" title="Vitesse 3 · double-clic : par défaut" aria-label="Vitesse 3">▶▶▶</button>
      </div>
    </div>
    <button id="hud-menu" class="icon-btn hud-menu" type="button" title="Menu" aria-label="Menu">☰</button>
  </header>

  <nav class="rail" aria-label="Actions">
    <button type="button" data-panel="alerts" title="Notifications importantes"><span class="rail-icon">🔔</span><span class="rail-label">Alertes</span><span id="badge-alerts" class="badge" hidden></span></button>
    <button type="button" data-panel="fleet" title="Ma flotte"><span class="rail-icon">🚢</span><span class="rail-label">Flotte</span><span id="badge-fleet" class="badge" hidden></span></button>
    <button type="button" data-panel="broker" title="Courtier maritime"><span class="rail-icon">🏗️</span><span class="rail-label">Courtier</span></button>
    <button type="button" data-panel="office" title="Bureau"><span class="rail-icon">💼</span><span class="rail-label">Bureau</span></button>
    <button type="button" data-panel="markets" title="Marchés"><span class="rail-icon">📈</span><span class="rail-label">Marchés</span></button>
    <button type="button" data-panel="news" title="Journal"><span class="rail-icon">📰</span><span class="rail-label">Journal</span></button>
    <!-- Une médaille par victoire, une couleur par chemin : l'anneau autour suit votre progression, le point rouge un concurrent à 75 % ou plus. -->
    <div class="vic-rail" role="group" aria-label="Victoires">
      <button type="button" class="vic-btn" data-victory="domination"><span class="vic-btn-icon" aria-hidden="true">🚩</span><span class="vic-dot" hidden></span></button>
      <button type="button" class="vic-btn" data-victory="reputation"><span class="vic-btn-icon" aria-hidden="true">🌟</span><span class="vic-dot" hidden></span></button>
      <button type="button" class="vic-btn" data-victory="legend"><span class="vic-btn-icon" aria-hidden="true">🏆</span><span class="vic-dot" hidden></span></button>
      <button type="button" class="vic-btn" data-victory="shadow"><span class="vic-btn-icon" aria-hidden="true">🗡</span><span class="vic-dot" hidden></span></button>
    </div>
  </nav>

  <div id="ticker" class="ticker"></div>
  <button type="button" id="standings" class="standings" title="Classement" hidden></button>
  <aside id="panel" class="panel" hidden></aside>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="screen" class="screen" hidden></div>
  <div id="dialogs"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
